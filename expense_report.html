<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчёт по расходам за 2026-04</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    h1, h2 {
      margin-top: 0;
    }
    .summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .summary-item {
      background: #eef2ff;
      border-radius: 12px;
      padding: 14px 16px;
      min-width: 180px;
    }
    .summary-label {
      display: block;
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .summary-value {
      font-size: 28px;
      font-weight: bold;
      color: #111827;
    }
    .chart {
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .legend-label, .axis-label, .point-label, .empty-label {
      fill: #374151;
      font-size: 13px;
    }
    .grid-line {
      stroke: #d1d5db;
      stroke-width: 1;
    }
    .axis-line {
      stroke: #6b7280;
      stroke-width: 1.5;
    }
    .line-path {
      fill: none;
      stroke: #4f46e5;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line-point {
      fill: #4f46e5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    th {
      background: #f9fafb;
    }
  </style>
</head>

        <tbody>

    </div>
  </div>
</body>
</html>
